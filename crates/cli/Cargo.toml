[package]
name = "aperture-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aperture-cli"
path = "src/main.rs"

[dependencies]
aperture-client = { path = "../client" }
aperture-protocol = { path = "../protocol" }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
rpassword = "5"
