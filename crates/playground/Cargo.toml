[package]
name = "aperture-playground"
version = "0.1.0"
edition = "2021"

[dependencies]
aperture-engine = { path = "../engine" }
aperture-sandbox-code = { path = "../sandbox-code" }
aperture-runtime = { path = "../runtime" }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
dotenvy = "0.15"
