[package]
name = "aperture-sandbox-code"
version = "0.1.0"
edition = "2021"

[dependencies]
aperture-engine = { path = "../engine" }
rquickjs = { version = "0.11", features = ["parallel"] }
tokio = { version = "1", features = ["sync", "rt"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
