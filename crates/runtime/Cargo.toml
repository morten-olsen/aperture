[package]
name = "aperture-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
aperture-engine = { path = "../engine" }
aperture-sandbox-os = { path = "../sandbox-os" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
glob-match = "0.2"
dirs = "6"
sha2 = "0.10"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
cron = "0.15"
chrono = "0.4"
reqwest = { version = "0.13", features = ["json"] }
scraper = "0.25"
html2text = "0.16"
url = "2"
argon2 = "0.5"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
