[package]
name = "aperture-server"
version = "0.1.0"
edition = "2021"

[dependencies]
aperture-engine = { path = "../engine" }
aperture-runtime = { path = "../runtime" }
aperture-sandbox-code = { path = "../sandbox-code" }
aperture-calendar = { path = "../calendar" }
aperture-protocol = { path = "../protocol" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
dotenvy = "0.15"
futures = "0.3"
reqwest = { version = "0.13", features = ["json"] }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
