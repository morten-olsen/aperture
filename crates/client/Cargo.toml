[package]
name = "aperture-client"
version = "0.1.0"
edition = "2021"

[dependencies]
aperture-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["sync", "rt"] }
tokio-tungstenite = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
reqwest = { version = "0.12", features = ["json"] }
